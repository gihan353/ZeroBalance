<!DOCTYPE html>
<html>
<head>
    <title>Dev Profile</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
            width: 250px;
            transition: transform 0.3s;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #00ff88;
            border-radius: 50%;
            margin: 0 auto 15px;
        }
        button {
            background: transparent;
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button.active {
            background: #00ff88;
            color: #121212;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar"></div>
        <h2>Git Master</h2>
        <p>Merging branches like a pro.</p>
        <button onclick="toggleFollow(this)">Follow</button>
    </div>

    <script>
        function toggleFollow(btn) {
            btn.classList.toggle('active');
            btn.innerText = btn.classList.contains('active') ? 'Following' : 'Follow';
        }
    </script>

</body>
</html>
